<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <div class="bg-emerald-50 p-10 rounded-[35px] text-center border-2 border-emerald-100 shadow-sm">
        <p class="text-emerald-600 font-black text-xl mb-6 uppercase tracking-wider">Số lần MỞ</p>
        <p id="openCnt" class="text-6xl md:text-8xl font-black text-emerald-700 italic drop-shadow-sm">0</p>
    </div>
    <div class="bg-rose-50 p-10 rounded-[35px] text-center border-2 border-rose-100 shadow-sm">
        <p class="text-rose-600 font-black text-xl mb-6 uppercase tracking-wider">Số lần ĐÓNG</p>
        <p id="closeCnt" class="text-6xl md:text-8xl font-black text-rose-700 italic drop-shadow-sm">0</p>
    </div>
</div>

<script>
    // Các phần khai báo ngày và MQTT
    async function getStats() {
        const selectedDate = document.getElementById('datePicker').value;
        try {
            const res = await fetch(`/api/door/stats?date=${selectedDate}`);
            const data = await res.json();         
            if(data.success) {
                const openEl = document.getElementById('openCnt');
                const closeEl = document.getElementById('closeCnt');
                // Hiển thị trực tiếp dữ liệu số từ Server
                openEl.innerText = data.stats.opens;
                closeEl.innerText = data.stats.closes;
                openEl.style.fontSize = "";
                closeEl.style.fontSize = "";
            }
        } catch (error) {
            console.error("Lỗi truy vấn dữ liệu:", error);
        }
    }
    window.onload = getStats;
    setInterval(getStats, 15000);
</script>
